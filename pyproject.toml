[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-agent"
version = "0.1.0"
description = "A safe, intelligent LinkedIn automation agent with human-in-the-loop approval"
requires-python = ">=3.11"
dependencies = [
    # AI / LLM
    "anthropic>=0.30.0",

    # Browser automation (LinkedIn interaction)
    "playwright>=1.44.0",
    "playwright-stealth>=1.0.6",

    # Scheduling
    "apscheduler>=3.10.4",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",       # PostgreSQL async driver
    "aiosqlite>=0.20.0",     # SQLite async driver (dev/test)

    # Cache / rate limiting
    "redis[hiredis]>=5.0.4",

    # Web UI / API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",  # form data

    # Telegram approval bot
    "python-telegram-bot>=21.3",

    # HTTP client (open-web research)
    "httpx>=0.27.0",

    # HTML parsing
    "beautifulsoup4>=4.12.3",
    "selectolax>=0.3.21",

    # Web search / company intel
    "google-search-results>=2.4.2",   # SerpAPI client

    # Configuration & env
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # Email (approval fallback + reports)
    "sendgrid>=6.11.0",

    # Google Sheets sync (optional export)
    "gspread>=6.1.2",
    "google-auth>=2.29.0",

    # Utilities
    "tenacity>=8.3.0",    # retry logic
    "structlog>=24.2.0",  # structured logging
    "cryptography>=42.0.8",  # cookie/credential encryption
    "rich>=13.7.1",       # CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-playwright>=0.5.1",
    "respx>=0.21.1",         # mock httpx calls
    "ruff>=0.4.7",
    "black>=24.4.2",
    "mypy>=1.10.0",
]

[project.scripts]
linkedin-agent = "linkedin_agent.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
